<title>Griotte Initial States</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a datasheet bench. Registers on the left, one linear address tape in
   the middle (bands of words, low addresses on top), a detail sheet on the
   right; stacked at phone width. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #e4e9ef;
  --line: #c9d1db;
  --line-strong: #9aa6b5;
  --fg: #17202b;
  --muted: #586577;
  --exec: #3552c8;      /* executable capabilities (X) */
  --data: #0b7d72;      /* data capabilities (R/W) */
  --sentry: #a8650c;    /* sentries */
  --sealed: #9b3486;    /* sealed capabilities, sealing ranges */
  --untrusted: #b8462a; /* untrusted compartments */
  --focus: #1f5fe0;
  --hl: #f2b51f;        /* hover target highlight */
  --font-sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-cond: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --addrw: 168px;
  --railw: 104px;
  --gutter: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #151c25; --surface-2: #1c2531; --line: #2b3646; --line-strong: #46546a;
    --fg: #e2e7ee; --muted: #93a0b2;
    --exec: #8fa3ff; --data: #4cc9b8; --sentry: #e9ae4f; --sealed: #e083cf; --untrusted: #ee8a6b;
    --focus: #7fa6ff; --hl: #f2c14e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c25; --surface-2: #1c2531; --line: #2b3646; --line-strong: #46546a;
  --fg: #e2e7ee; --muted: #93a0b2;
  --exec: #8fa3ff; --data: #4cc9b8; --sentry: #e9ae4f; --sealed: #e083cf; --untrusted: #ee8a6b;
  --focus: #7fa6ff; --hl: #f2c14e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-sans); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  overflow-x: hidden;
}
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
code, .mono { font-family: var(--font-mono); font-size: 12.5px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button { font: inherit; color: inherit; }
pre { margin: 0; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 14px; }
.top h1 { font-family: var(--font-cond); font-weight: 600; font-size: 22px; letter-spacing: 0.01em; }
.top .pred { color: var(--muted); font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cases { display: flex; flex-wrap: wrap; gap: 4px; }
.seg {
  border: 1px solid var(--line); background: var(--surface); border-radius: 4px;
  padding: 3px 9px; font-family: var(--font-mono); font-size: 12.5px; cursor: pointer;
}
.seg[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg:hover { border-color: var(--line-strong); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 16px; }
.legend .chip { pointer-events: none; }
.binders { color: var(--muted); font-family: var(--font-mono); font-size: 12px; margin-bottom: 10px; overflow-x: auto; white-space: pre; }

/* Main grid */
.bench { display: grid; grid-template-columns: minmax(220px, 270px) minmax(0, 1fr) minmax(300px, 370px); gap: 16px; align-items: start; }
.bench > * { min-width: 0; }
@media (max-width: 1180px) { .bench { grid-template-columns: minmax(220px, 260px) minmax(0, 1fr); } .detail { grid-column: 1 / -1; } }
@media (max-width: 760px) { .bench { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.panel-h { font-family: var(--font-cond); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 10px 12px 6px; }

/* Registers */
.regs .bank { padding: 0 12px 10px; display: grid; gap: 6px; }
.reg { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 2px 8px; align-items: start; padding: 4px 6px; border-radius: 4px; }
.reg .rn { font-family: var(--font-mono); font-weight: 600; font-size: 12.5px; padding-top: 2px; }
.reg .rv { min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.reg .rv .mono { overflow-wrap: anywhere; }
.reg .rc { grid-column: 2; color: var(--muted); font-size: 12px; }
.note { margin: 0 12px 10px; padding: 6px 8px; border: 1px dashed var(--line-strong); border-radius: 4px; color: var(--muted); font-size: 12px; }
.note code { color: var(--fg); overflow-wrap: anywhere; }

/* The address tape */
.tape { padding-right: var(--gutter); }
.tape-note { color: var(--muted); font-size: 12px; margin: 0 0 10px; max-width: 70ch; }
.band {
  display: grid; grid-template-columns: var(--railw) minmax(0, 1fr); cursor: pointer;
  border-radius: 3px;
}
.rail {
  border-right: 3px solid var(--line-strong); padding: 6px 8px 6px 0; display: flex; flex-direction: column; gap: 2px;
  align-items: flex-end; text-align: right; min-width: 0;
}
.rail .own { font-family: var(--font-mono); font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.rail .sub { font-family: var(--font-cond); font-size: 12.5px; color: var(--muted); line-height: 1.25; }
.band.untrusted .rail { border-right-color: var(--untrusted); }
.band.untrusted .rail .own { color: var(--untrusted); }
.band.implicit .rail { border-right-style: dashed; }
.tag { font-family: var(--font-cond); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line-strong); color: var(--muted); }
.tag.untrusted { color: var(--untrusted); border-color: var(--untrusted); }
.words { min-width: 0; display: grid; }
.row { display: grid; grid-template-columns: var(--addrw) minmax(0, 1fr); min-width: 0; }
.addr {
  font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: right; padding: 0 8px 0 6px;
  overflow-wrap: anywhere; line-height: 1.3; min-width: 0; font-variant-numeric: tabular-nums;
}
.edge .addr { color: var(--fg); font-weight: 500; padding-block: 2px; }
.edge .line { border-top: 2px solid var(--fg); }
.edge.top .line { align-self: end; }
.edge.bot .line { align-self: start; }
.band.implicit .edge .line { border-top-style: dashed; }
.cell {
  min-width: 0; border-left: 1px solid var(--line-strong); border-right: 1px solid var(--line-strong); border-top: 1px solid var(--line);
  background: var(--surface); padding: 3px 8px; display: flex; flex-wrap: wrap; gap: 3px 8px; align-items: center; min-height: 28px;
}
.row:first-of-type .cell, .edge + .row .cell { border-top: none; }
.cell.comp {
  min-height: 48px; padding-block: 8px;
  background:
    repeating-linear-gradient(-45deg, var(--surface-2) 0 2px, transparent 2px 9px),
    var(--surface);
  border-left-style: dashed; border-right-style: dashed;
}
.cell.empty { min-height: 22px; color: var(--muted); font-size: 12px; font-style: italic; }
.band.untrusted .cell {
  background:
    repeating-linear-gradient(135deg, color-mix(in srgb, var(--untrusted) 10%, transparent) 0 5px, transparent 5px 12px),
    var(--surface);
}
.band.implicit .cell { background: transparent; border-style: dashed; }
.cell .what { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.cell .len { font-family: var(--font-cond); font-size: 12px; color: var(--muted); }
.cell .arbn { font-family: var(--font-cond); font-size: 11.5px; padding: 0 6px; border-radius: 3px; color: var(--untrusted); border: 1px solid var(--untrusted); background: color-mix(in srgb, var(--untrusted) 12%, var(--surface)); }
.cell .cmt { color: var(--muted); font-size: 12px; }
.cell .val { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.pts { flex-basis: 100%; display: grid; gap: 2px; margin-top: 2px; }
.pt { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; font-size: 12px; border-left: 2px solid var(--fg); padding: 1px 6px; background: var(--surface); border-radius: 0 3px 3px 0; width: fit-content; max-width: 100%; }
.pt .pa { font-family: var(--font-mono); font-size: 11px; font-weight: 500; overflow-wrap: anywhere; }
.pt .pl { color: var(--muted); }
.gap { height: 14px; display: grid; grid-template-columns: var(--railw) var(--addrw) minmax(0, 1fr); }
.gap::after { content: ""; grid-column: 3; justify-self: center; width: 0; border-left: 2px dotted var(--line-strong); }
.band:hover .rail .own { text-decoration: underline; }
.band.selected .rail { border-right-color: var(--focus); }
.band.selected .cell { border-left-color: var(--focus); border-right-color: var(--focus); }
.band.target .cell { box-shadow: inset 3px 0 0 var(--hl); }
.anchor { outline: 2px solid var(--hl); outline-offset: -2px; }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--hl); } 100% { box-shadow: 0 0 0 0 transparent; } }
.entry { display: inline-flex; flex-wrap: wrap; gap: 2px 8px; font-family: var(--font-mono); font-size: 12px; }
.entry span i { font-style: normal; color: var(--muted); font-size: 10.5px; margin-right: 2px; }
.ptr { border: none; background: none; padding: 0 2px; font: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; border-radius: 2px; }
.ptr:hover, .ptr.active { background: color-mix(in srgb, var(--exec) 18%, transparent); }
@media (max-width: 760px) {
  :root { --addrw: 96px; --gutter: 36px; }
  .band { grid-template-columns: minmax(0, 1fr); }
  .rail { border-right: none; border-bottom: 3px solid var(--line-strong); flex-direction: row; flex-wrap: wrap; align-items: baseline; justify-content: flex-start; text-align: left; padding: 10px 0 8px; gap: 2px 8px; }
  .band.untrusted .rail { border-bottom-color: var(--untrusted); }
  .gap { grid-template-columns: var(--addrw) minmax(0, 1fr); }
  .gap::after { grid-column: 2; }
}

/* Capability chips */
.chip {
  --k: var(--data);
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%;
  border: 1px solid var(--k); border-radius: 3px; padding: 1px 6px;
  background: color-mix(in srgb, var(--k) 11%, var(--surface));
  font-family: var(--font-mono); font-size: 12px; line-height: 1.5; cursor: pointer; text-align: left;
}
.chip.exec { --k: var(--exec); }
.chip.sentry { --k: var(--sentry); }
.chip.sealed, .chip.sealrange { --k: var(--sealed); }
.chip.local { border-style: dashed; }
.chip .p { font-weight: 600; color: var(--k); }
.chip .loc { font-size: 10px; padding: 0 3px; border-radius: 2px; background: var(--surface-2); color: var(--muted); }
.chip.local .loc { background: var(--k); color: var(--surface); }
.chip .tgt { color: var(--fg); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip:hover, .chip.active { background: color-mix(in srgb, var(--k) 24%, var(--surface)); }
.chip.incoming { box-shadow: 0 0 0 2px var(--hl); }

/* Detail */
.detail { padding: 12px 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.detail > *, .dtable .drow > *, .inc li > * { min-width: 0; }
@media (min-width: 1181px) { .detail { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; } }
.detail h2 { font-family: var(--font-cond); font-size: 19px; font-weight: 600; }
.eyebrow { font-family: var(--font-cond); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.detail h4 { font-family: var(--font-cond); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
.bounds { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.badge { font-family: var(--font-cond); font-size: 11.5px; letter-spacing: 0.03em; padding: 1px 6px; border-radius: 3px; background: var(--surface-2); color: var(--fg); }
.badge.arb { background: color-mix(in srgb, var(--untrusted) 16%, var(--surface)); color: var(--untrusted); border: 1px solid var(--untrusted); }
.badge.code { font-family: var(--font-mono); font-size: 11px; }
.code { background: var(--surface-2); border-radius: 4px; padding: 8px 10px; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; white-space: pre; }
.code + .code { margin-top: 6px; }
.dim { color: var(--muted); font-size: 12.5px; }
.cmt { color: var(--muted); font-size: 12px; }
.field { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.idx { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; text-align: right; font-variant-numeric: tabular-nums; }
.item-v { min-width: 0; display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: center; }
.item-v .mono { overflow-wrap: anywhere; font-size: 12px; }
.inc { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.inc li { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.srcbtn { border: none; background: none; padding: 0; color: var(--focus); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: 12.5px; }
.dtable { display: grid; gap: 4px; }
.dtable .drow { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 6px; }
.sect + .sect { margin-top: 10px; }
.sect-t { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-family: var(--font-mono); }
.facts summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.facts pre { margin-top: 6px; }

/* Code panel: the region's words, with their offsets as on the tape */
.codep { border: 1px solid var(--line); border-radius: 4px; max-height: 32em; overflow: auto; background: var(--surface); }
.crow { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 0 8px; padding: 1px 8px; border-top: 1px solid var(--line); align-items: baseline; }
.crow:first-child { border-top: none; }
.crow .co { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: right; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.crow .cv { min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.crow .ci { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.crow .cw { font-family: var(--font-mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.crow.lbl { background: var(--surface-2); }
.crow.lbl .ci { font-weight: 600; }
.crow.piece { background: color-mix(in srgb, var(--surface-2) 60%, var(--surface)); }
.crow.piece .ci { font-family: var(--font-cond); font-size: 12.5px; color: var(--muted); }
.crow.hit { box-shadow: inset 3px 0 0 var(--exec); }
.crow.anchor { outline-offset: -2px; }
.crow .cn { color: var(--exec); font-size: 11.5px; }
.pt[data-row] { cursor: pointer; }

/* Bottom: other statements and raw text */
.others { margin-top: 16px; padding: 4px 14px 14px; }
.others .sect-t { margin-top: 8px; }

/* Arrow overlay and tooltip */
#wires { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 40; overflow: visible; }
#wires path.w { fill: none; stroke-width: 2; }
#wires path.br { fill: none; stroke-width: 2.5; }
#wires text { font-family: var(--font-mono); font-size: 10.5px; }
#tip {
  position: fixed; z-index: 50; pointer-events: none; max-width: min(440px, calc(100vw - 24px));
  background: var(--fg); color: var(--bg); border-radius: 5px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
}
#tip dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 10px; margin: 0; }
#tip dt { opacity: .7; font-family: var(--font-cond); text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; padding-top: 2px; }
#tip dd { margin: 0; font-family: var(--font-mono); overflow-wrap: anywhere; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>

<header class="top">
  <div>
    <h1>Griotte initial states</h1>
    <div class="pred" id="pred"></div>
  </div>
  <div class="controls">
    <div class="cases" id="cases" role="group" aria-label="Case study"></div>
    <button class="seg" id="rawbtn" aria-pressed="false" type="button">Statements as text</button>
  </div>
</header>
<div class="binders" id="binders"></div>
<div class="legend" aria-label="Legend">
  <span class="chip exec"><span class="p">RX</span><span class="loc">G</span></span> executable
  <span class="chip"><span class="p">RW</span><span class="loc">G</span></span> data
  <span class="chip sentry"><span class="p">E·Inherit RX</span><span class="loc">G</span></span> sentry
  <span class="chip sealed"><span class="p">⟨ot⟩ RO</span><span class="loc">G</span></span> sealed
  <span class="chip local"><span class="p">RWL</span><span class="loc">L</span></span> dashed: Local
  <span>Hover a capability: the arrow lands on the word at its cursor, the bracket spans its bounds. Click a band for its contents, code and constraints.</span>
</div>

<main class="bench" id="bench">
  <aside class="panel regs" id="regs" aria-label="Registers"></aside>
  <section class="tape" id="tape" aria-label="Memory, as one address tape"></section>
  <aside class="panel detail" id="detail" aria-live="polite"></aside>
</main>
<section class="panel others" id="others"></section>
<section id="raw" hidden><pre class="code" id="rawtext"></pre></section>

<svg id="wires" aria-hidden="true">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="context-stroke"></path>
    </marker>
  </defs>
  <g id="wireg"></g>
</svg>
<div id="tip" hidden></div>

<script type="application/json" id="data">/*__DATA__*/</script>
<script>
"use strict";
/* The model is built by model.py from the JSON print: regions with their
   cells (words, compressed pieces) and the points inside them, capabilities
   with their target region and the cell or point at their cursor, registers,
   constraints and the code constants. This script only draws it. */
const CASES = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const isNum = (s) => /^\d+$/.test(String(s));

let cs = null;          // current case study
let capById = {}, regById = {};
let tape = null;        // { bands: [{region, cells}], els: {id -> cell/point} }
let hovered = null;     // element under hover/focus (chip or pointer)

const OWNER_INFO = {
  switcher: ["switcher", "trusted"],
  assert: ["assert", "library"],
  "thread 0": ["thread 0", "thread"],
  heap: ["heap", "heap"],
  machine: ["machine", "implicit"],
};

/* ---------- Chips ---------- */
function capClass(c) {
  if (c.kind === "sealrange") return "sealrange";
  if (c.sealed) return "sealed";
  if (c.sentry) return "sentry";
  if (/X/.test(c.perm)) return "exec";
  return "data";
}
function regionTitle(r, withOwner) {
  if (!r) return "";
  let t = r.sub || r.label || "";
  if (!r.sub && r.label && r.owner && r.label.startsWith(r.owner + ",")) t = r.label.slice(r.owner.length + 1).trim();
  if (withOwner && r.owner && r.owner !== "machine" && !t.startsWith(r.owner)) t = r.owner + " · " + t;
  return t;
}
function anchorName(c) {
  const a = c.anchor && tape.els[c.anchor];
  return a ? a.name : "";
}
function chip(c, opts = {}) {
  if (!c) return "";
  const cls = ["chip", capClass(c)];
  if (c.loc === "Local") cls.push("local");
  let p = c.perm;
  if (c.sentry) p = "E·" + c.sentry + " " + p;
  if (c.sealed) p = "⟨" + c.sealed + "⟩ " + p;
  if (c.kind === "sealrange") p = "seal " + p;
  const r = c.target && regById[c.target];
  const tgt = opts.noTarget ? "" : `<span class="tgt">→ ${esc(r ? regionTitle(r, true) : c.kind === "sealrange" ? "otypes" : "")}</span>`;
  const home = opts.home ? ' data-home="1"' : "";

/* ---------- The tape ---------- */
function bandOrder() {
  // the print's ranges_disjoint order; heap, then implicit regions, last.
  const rank = (r) => (r.implicit ? 2 : r.owner === "heap" ? 1 : 0);

      tape.els[c.id] = c;
      for (const p of c.points || []) tape.els[p.id] = p;
    }

}

/* ---------- The code panel ---------- */

function renderDetail(id) {

const smooth = () => (window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth");

}

function load(name) {
  cs = CASES.find((c) => c.name === name) || CASES[0];
  capById = Object.fromEntries(cs.caps.map((c) => [c.id, c]));
  regById = Object.fromEntries(cs.regions.map((r) => [r.id, r]));

/* ---------- Hover: wire to the cursor, bracket over the bounds ---------- */
function hover(el) {
  if (hovered === el) return;
  unhover();
  hovered = el;
  el.classList.add("active");
  if (el.dataset.cap) {
    const c = capById[el.dataset.cap];
    if (!c) return;
    if (c.target) { const t = $("reg-" + c.target); if (t) t.classList.add("target"); }
    const a = c.anchor && $(c.anchor); if (a) a.classList.add("anchor");
    const cr = codeRow(c.anchor && tape.els[c.anchor]); if (cr) cr.classList.add("anchor");
    showTip(el, capRows(c));
  } else {
    const p = tape.els[el.dataset.ptr];

    const cr = codeRow(p); if (cr) cr.classList.add("anchor");

}

function showTip(el, rows) {

  let y = r.bottom + 8;
  if (y + h > window.innerHeight - 8) y = Math.max(8, r.top - h - 8);

}

    c = capById[hovered.dataset.cap];
    if (!c) return;
    color = css({ exec: "--exec", data: "--data", sentry: "--sentry", sealed: "--sealed", sealrange: "--sealed" }[capClass(c)]);
    tEl = (c.anchor && $(c.anchor)) || (c.target && $("reg-" + c.target)?.querySelector(".words"));
  } else {
    color = css("--exec");

      const y1 = bEl ? bEl.getBoundingClientRect().top : wr.top;
      const y2 = eEl ? eEl.getBoundingClientRect().top : wr.bottom;
      const x = cellsRight + 8;

    }
  }

  const ey = Math.min(Math.max(b.top + Math.min(12, b.height / 2), ay), b.bottom - Math.min(12, b.height / 2));

  out += `<circle cx="${sx}" cy="${ay}" r="3" fill="${color}"></circle><path class="w" d="${d}" stroke="${color}" marker-end="url(#ah)"></path>`;

}

function markIncoming(id, on) {
  for (const c of cs.caps) if (c.target === id)
    document.querySelectorAll(`.chip[data-cap="${c.id}"][data-home]`).forEach((e) => e.classList.toggle("incoming", on));
}

function wire() {
  $("cases").innerHTML = CASES.map((c) => `<button type="button" class="seg" data-case="${esc(c.name)}" aria-pressed="false">${esc(c.name)}</button>`).join("");

  $("rawbtn").addEventListener("click", () => {

  });
  const hov = (e) => e.target.closest && e.target.closest(".chip[data-cap], .ptr[data-ptr]");

  document.addEventListener("pointerout", (e) => { const c = hov(e); if (c && c === hovered && !c.contains(e.relatedTarget)) unhover(); });
  document.addEventListener("focusin", (e) => { const c = hov(e); if (c) hover(c); else unhover(); const r = e.target.closest && e.target.closest(".band"); if (r) markIncoming(r.dataset.region, true); });
  document.addEventListener("focusout", (e) => { const r = e.target.closest && e.target.closest(".band"); if (r) markIncoming(r.dataset.region, false); });
  document.addEventListener("mouseover", (e) => { const r = e.target.closest && e.target.closest(".band"); if (r && !r.contains(e.relatedTarget)) markIncoming(r.dataset.region, true); });
  document.addEventListener("mouseout", (e) => { const r = e.target.closest && e.target.closest(".band"); if (r && !r.contains(e.relatedTarget)) markIncoming(r.dataset.region, false); });
  document.addEventListener("click", (e) => {
    const src = e.target.closest("[data-src]");
    if (src) {
      const c = capById[src.dataset.src];
      flash(c.src_kind === "reg" ? $("regrow-" + c.src) : document.querySelector(`.chip[data-cap="${c.id}"][data-home]`));
      return;
    }
    const p = e.target.closest(".ptr[data-ptr]");
    if (p) { if (!showCodeRow(tape.els[p.dataset.ptr])) flash($(p.dataset.ptr)); return; }
    const pt = e.target.closest(".pt[data-row]");
    if (pt) { showCodeRow(tape.els[pt.id]); return; }
    const c = e.target.closest(".chip[data-cap]");
    if (c) {
      const cap = capById[c.dataset.cap];
      if (cap && cap.target) {
        select(cap.target, true);
        flash((cap.anchor && $(cap.anchor)) || $("reg-" + cap.target));
        const cr = codeRow(cap.anchor && tape.els[cap.anchor]); if (cr) cr.scrollIntoView({ block: "nearest" });
      }
      return;
    }
    const r = e.target.closest(".band");
    if (r) select(r.dataset.region, true);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") unhover();
    const r = e.target.closest && e.target.closest(".band");
    if (r && e.target === r && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(r.dataset.region, true); }
  });
  let raf = 0;
  const redraw = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; drawWire(); }); };
  window.addEventListener("scroll", redraw, { capture: true, passive: true });
  window.addEventListener("resize", redraw);
}

wire();
if (CASES.length) load(CASES[0].name);
</script>
